[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "phase1-isl-static-recognition"
version = "0.1.0"
description = "A local, landmark-based static Indian Sign Language recognition baseline."
requires-python = ">=3.10,<3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
